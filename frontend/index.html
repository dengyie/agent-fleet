<!DOCTYPE html>
<html lang="zh" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Fleet — AI Mesh Console</title>
<link rel="stylesheet" href="./styles/app.css">
</head>
<body data-page="fleet">
<div class="fleet-layout-root">
  <!-- 侧边栏导航 (Awesome UI Kit Sidebar Console) -->
  <aside class="fleet-sidebar" id="fleet-sidebar">
    <div class="sidebar-header">
      <a class="brand-link" href="./index.html">
        <span class="brand-icon" id="brand-logo-slot"></span>
        <div class="brand-meta">
          <span class="brand-title">Agent Fleet</span>
          <span class="brand-sub">AI Mesh Console</span>
        </div>
      </a>
      <div class="sidebar-status-wrap" id="sidebar-status-slot"></div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-title">CLUSTER OVERVIEW</div>
      <a href="./index.html" class="nav-item active" data-nav="fleet" id="nav-item-fleet">
        <span class="nav-icon" id="icon-nav-fleet"></span>
        <span class="nav-text">Fleet Cluster</span>
        <span class="nav-pill" id="nav-online-pill">0/0</span>
      </a>

      <div class="nav-section-title">COMPUTE NODES</div>
      <div class="sidebar-nodes-list" id="sidebar-nodes-list">
        <!-- 动态由 store 订阅更新 -->
      </div>

      <div class="nav-section-title">EXTERNAL & API</div>
      <a href="./api/status" class="nav-item" target="_blank" rel="noopener">
        <span class="nav-icon" id="icon-nav-status"></span>
        <span class="nav-text">Status API</span>
        <span class="nav-meta-icon" id="icon-ext-status"></span>
      </a>
      <a href="./api/tasks" class="nav-item" target="_blank" rel="noopener">
        <span class="nav-icon" id="icon-nav-tasks"></span>
        <span class="nav-text">Tasks API</span>
        <span class="nav-meta-icon" id="icon-ext-tasks"></span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="theme-toggle-panel" id="theme-toggle-panel">
        <button type="button" class="theme-btn" data-theme-mode="auto" title="跟随系统与时间">
          <span class="theme-icon" id="icon-theme-auto"></span>
          <span>Auto</span>
        </button>
        <button type="button" class="theme-btn" data-theme-mode="light" title="浅色模式">
          <span class="theme-icon" id="icon-theme-light"></span>
          <span>Light</span>
        </button>
        <button type="button" class="theme-btn" data-theme-mode="dark" title="深色模式">
          <span class="theme-icon" id="icon-theme-dark"></span>
          <span>Dark</span>
        </button>
      </div>
      <div class="sidebar-meta-row">
        <span class="version-tag">c73f6be • LIVE</span>
        <span class="sse-status-badge" id="sidebar-sse-status">Connecting</span>
      </div>
    </div>
  </aside>

  <!-- 移动端遮罩 -->
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <!-- 主视口 -->
  <div class="fleet-main-wrap">
    <header class="fleet-topbar">
      <div class="topbar-left">
        <button type="button" class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Navigation">
          <span id="icon-mobile-menu"></span>
        </button>
        <div class="breadcrumb" id="top-breadcrumb">
          <a class="bc-item bc-link" href="./index.html">Fleet</a>
          <span class="bc-sep">/</span>
          <span class="bc-item bc-current" id="bc-current-title">Cluster Overview</span>
        </div>
      </div>
      <div class="topbar-right">
        <button type="button" class="topbar-action-btn" id="btn-global-refresh" title="刷新数据">
          <span class="btn-icon" id="icon-btn-refresh"></span>
          <span>Refresh</span>
        </button>
        <div class="connection-status-pill" id="connection-pill" title="实时 SSE 连接通道">
          <span class="pill-pulse-dot" id="sse-dot"></span>
          <span class="pill-label" id="connection-label">Disconnected</span>
        </div>
      </div>
    </header>

    <main class="fleet-main">
      <!-- 静态 shell 挂载点：由 views 填充，不内嵌任何观测/任务数据 -->
      <section id="mount-fleet" class="view-section" data-route-view="fleet"></section>
      <section id="mount-machine" class="view-section" data-route-view="machine" hidden></section>
      <section id="mount-task" class="view-section" data-route-view="task" hidden></section>
      <section id="mount-session" class="view-section" data-route-view="session" hidden></section>
    </main>
  </div>
</div>

<script src="./config.js"></script>
<script type="module">
  /* 静态 shell 组合层（基于 awesome-ui-kit 原生控制台规范）：
     创建单例 store/client/SSE，按 data-page 路由挂载对应视图。
     提供侧边栏响应式导航、高质感状态指示胶囊与主题切换器。 */
  import { apiPath, pagePath, uiIcon } from './routes.js';
  import { mountFleet } from './views/fleet.js';
  import { mountMachine } from './views/machine.js';
  import { mountTask } from './views/task.js';
  import { mountSession } from './views/session.js';
  import {
    getStatus, getMachine, getEvents, listTasks, getTask, createTask,
    cancelTask, retryTask, getSession, getSessionEvents, getSessionSignals,
    listSessions, listAdoptions, adoptInstance, revokeAdoption, retryAdoption,
    controlSession, listAgentTypes,
  } from './api/client.js';
  import { FleetStore } from './state/store.js';
  import { SseClient } from './realtime/sse.js';

  window.FleetRoutes = { apiPath: apiPath, pagePath: pagePath };

  /* 注入通用 SVG 图标 */
  function injectStaticIcons() {
    var brandSlot = document.getElementById('brand-logo-slot');
    if (brandSlot) brandSlot.innerHTML = uiIcon('activity', { size: 20, className: 'brand-svg' });
    var navFleet = document.getElementById('icon-nav-fleet');
    if (navFleet) navFleet.innerHTML = uiIcon('server', { size: 16 });
    var navStatus = document.getElementById('icon-nav-status');
    if (navStatus) navStatus.innerHTML = uiIcon('activity', { size: 16 });
    var extStatus = document.getElementById('icon-ext-status');
    if (extStatus) extStatus.innerHTML = uiIcon('external-link', { size: 12 });
    var navTasks = document.getElementById('icon-nav-tasks');
    if (navTasks) navTasks.innerHTML = uiIcon('terminal', { size: 16 });
    var extTasks = document.getElementById('icon-ext-tasks');
    if (extTasks) extTasks.innerHTML = uiIcon('external-link', { size: 12 });

    var themeAuto = document.getElementById('icon-theme-auto');
    if (themeAuto) themeAuto.innerHTML = uiIcon('monitor', { size: 13 });
    var themeLight = document.getElementById('icon-theme-light');
    if (themeLight) themeLight.innerHTML = uiIcon('sun', { size: 13 });
    var themeDark = document.getElementById('icon-theme-dark');
    if (themeDark) themeDark.innerHTML = uiIcon('moon', { size: 13 });

    var mobileMenu = document.getElementById('icon-mobile-menu');
    if (mobileMenu) mobileMenu.innerHTML = uiIcon('menu', { size: 18 });
    var btnRefresh = document.getElementById('icon-btn-refresh');
    if (btnRefresh) btnRefresh.innerHTML = uiIcon('refresh', { size: 14 });
  }
  injectStaticIcons();

  /* -- 主题管理 (ThemeToggle 规范实现) --------------------------------------- */
  var THEME_KEY = 'agent-fleet-theme';
  function resolveTheme(mode) {
    if (mode === 'light' || mode === 'dark') return mode;
    var hour = new Date().getHours();
    var isDarkSys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var isNight = hour >= 19 || hour < 7;
    return (isDarkSys || isNight) ? 'dark' : 'light';
  }

  function applyTheme(mode) {
    var resolved = resolveTheme(mode);
    document.documentElement.setAttribute('data-theme', mode);
    document.documentElement.setAttribute('data-resolved-theme', resolved);
    if (resolved === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    localStorage.setItem(THEME_KEY, mode);
    document.querySelectorAll('[data-theme-mode]').forEach(function (btn) {
      if (btn.getAttribute('data-theme-mode') === mode) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
  }

  var currentThemeMode = localStorage.getItem(THEME_KEY) || 'auto';
  applyTheme(currentThemeMode);

  document.querySelectorAll('[data-theme-mode]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var m = btn.getAttribute('data-theme-mode');
      applyTheme(m);
    });
  });

  /* 监听系统偏好变化 */
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      if ((localStorage.getItem(THEME_KEY) || 'auto') === 'auto') {
        applyTheme('auto');
      }
    });
  }

  /* -- 移动端侧边栏抽屉切换 ---------------------------------------------------- */
  var sidebar = document.getElementById('fleet-sidebar');
  var backdrop = document.getElementById('sidebar-backdrop');
  var menuBtn = document.getElementById('mobile-menu-btn');
  function toggleSidebar(open) {
    if (open) {
      sidebar.classList.add('open');
      backdrop.classList.add('open');
    } else {
      sidebar.classList.remove('open');
      backdrop.classList.remove('open');
    }
  }
  if (menuBtn) {
    menuBtn.addEventListener('click', function () {
      toggleSidebar(!sidebar.classList.contains('open'));
    });
  }
  if (backdrop) {
    backdrop.addEventListener('click', function () {
      toggleSidebar(false);
    });
  }

  /* -- 路由判定 ---------------------------------------------------------------- */
  function pageFromPath() {
    var segments = window.location.pathname.split('/');
    for (var i = 0; i < segments.length; i += 1) {
      if (segments[i] === 'task') return 'task';
      if (segments[i] === 'machine') return 'machine';
      if (segments[i] === 'session') return 'session';
    }
    var params = new URLSearchParams(window.location.search);
    if (params.get('task')) return 'task';
    if (params.get('machine')) return 'machine';
    if (params.get('session')) return 'session';
    return 'fleet';
  }
  var page = pageFromPath();
  var explicitPage = document.body.getAttribute('data-page');
  if (explicitPage && explicitPage !== 'fleet') {
    page = explicitPage;
  }

  /* 更新顶部面包屑标题 */
  var bcTitle = document.getElementById('bc-current-title');
  if (bcTitle) {
    if (page === 'fleet') {
      bcTitle.textContent = 'Cluster Overview';
    } else if (page === 'machine') {
      bcTitle.textContent = 'Compute Node';
    } else if (page === 'task') {
      bcTitle.textContent = 'Task Console';
    } else if (page === 'session') {
      bcTitle.textContent = 'Adopted Session';
    }
  }

  /* 客户端 API Client 装配 */
  var client = {
    getStatus: getStatus,
    getMachine: getMachine,
    getEvents: getEvents,
    listTasks: listTasks,
    getTask: getTask,
    createTask: createTask,
    cancelTask: cancelTask,
    retryTask: retryTask,
    getSession: getSession,
    getSessionEvents: getSessionEvents,
    getSessionSignals: getSessionSignals,
    listSessions: listSessions,
    listAdoptions: listAdoptions,
    adoptInstance: adoptInstance,
    revokeAdoption: revokeAdoption,
    retryAdoption: retryAdoption,
    controlSession: controlSession,
    listAgentTypes: listAgentTypes,
  };

  var store = new FleetStore();

  /* 终态任务刷新桥：由 SseClient 注入 client 后统一负责 */
  var sse = new SseClient(store, { client: client });
  sse.start();

  /* 导航状态：切换挂载区可见性 */
  var target = document.getElementById('mount-' + page);
  document.querySelectorAll('.view-section').forEach(function (el) {
    el.hidden = el !== target;
  });

  /* 全局手动刷新按键 */
  var btnRefresh = document.getElementById('btn-global-refresh');
  if (btnRefresh) {
    btnRefresh.addEventListener('click', function () {
      btnRefresh.classList.add('loading');
      client.getStatus().then(function (res) {
        if (res && res.data) {
          store.updateStatus(res.data);
        }
      }).finally(function () {
        setTimeout(function () {
          btnRefresh.classList.remove('loading');
        }, 500);
      });
    });
  }

  /* -- 响应式状态订阅：侧边栏节点列表、状态指示胶囊、在线徽标 -------------- */
  var nodesList = document.getElementById('sidebar-nodes-list');
  var onlinePill = document.getElementById('nav-online-pill');
  var sidebarSseStatus = document.getElementById('sidebar-sse-status');
  var connectionPill = document.getElementById('connection-pill');
  var connectionLabel = document.getElementById('connection-label');
  var sidebarStatusSlot = document.getElementById('sidebar-status-slot');

  function resolveCurrentMachineName() {
    var segments = window.location.pathname.split('/');
    for (var i = 0; i < segments.length; i += 1) {
      if (segments[i] === 'machine' && segments[i + 1]) {
        try { return decodeURIComponent(segments[i + 1]); } catch (e) { return null; }
      }
    }
    var params = new URLSearchParams(window.location.search);
    return params.get('machine') || null;
  }

  store.subscribe(function () {
    var st = store.getState();
    var live = st.connection === 'open';

    /* 更新顶栏与侧边栏 SSE 连接指示胶囊 */
    if (sidebarSseStatus) {
      sidebarSseStatus.textContent = live ? 'Connected' : (st.connection === 'reconnecting' ? 'Reconnecting' : 'Disconnected');
      sidebarSseStatus.className = 'sse-status-badge' + (live ? ' live' : (st.connection === 'reconnecting' ? ' warn' : ''));
    }
    if (connectionPill) {
      connectionPill.className = 'connection-status-pill' + (live ? ' live' : (st.connection === 'reconnecting' ? ' warn' : ''));
    }
    if (connectionLabel) {
      connectionLabel.textContent = live ? 'Live' : (st.connection === 'reconnecting' ? 'Reconnecting' : 'Offline');
    }

    /* 侧边栏整体健康指示胶囊 (StatusIndicator) */
    if (sidebarStatusSlot) {
      var statusData = st.status || {};
      var machines = statusData.machines || [];
      var onlineCount = 0;
      for (var i = 0; i < machines.length; i += 1) {
        if (machines[i].online) onlineCount += 1;
      }
      var totalCount = machines.length;
      if (totalCount > 0 && onlinePill) {
        onlinePill.textContent = onlineCount + '/' + totalCount;
      }

      var indicatorStatus = live ? (onlineCount > 0 ? 'online' : 'busy') : 'error';
      var indicatorLabel = live ? (onlineCount + '/' + totalCount + ' Nodes Online') : 'SSE Offline';
      var badgeCls = indicatorStatus === 'online' ? 'status-pill-ok' : (indicatorStatus === 'busy' ? 'status-pill-warn' : 'status-pill-bad');

      sidebarStatusSlot.innerHTML = '<div class="sidebar-status-indicator ' + badgeCls + '">' +
        '<span class="indicator-dot-wrap"><span class="indicator-ping"></span><span class="indicator-dot"></span></span>' +
        '<span class="indicator-label">' + indicatorLabel + '</span>' +
        '</div>';
    }

    /* 动态更新侧边栏中的机器计算节点列表 */
    if (nodesList && st.status && Array.isArray(st.status.machines)) {
      var currentMachine = resolveCurrentMachineName();
      while (nodesList.firstChild) {
        nodesList.removeChild(nodesList.firstChild);
      }
      var mList = st.status.machines;
      for (var mIdx = 0; mIdx < mList.length; mIdx += 1) {
        var mItem = mList[mIdx];
        var mName = mItem.machine || 'unknown';
        var isCurrent = (page === 'machine' && currentMachine === mName);

        var a = document.createElement('a');
        a.setAttribute('href', pagePath('machine', mName));
        a.className = 'sidebar-node-item' + (isCurrent ? ' active' : '') + (mItem.online ? ' is-online' : ' is-offline');

        var dot = document.createElement('span');
        dot.className = 'node-status-dot' + (mItem.online ? ' on' : ' off');
        a.appendChild(dot);

        var nameSpan = document.createElement('span');
        nameSpan.className = 'node-name-text';
        nameSpan.textContent = mName;
        a.appendChild(nameSpan);

        if (mItem.has_hermes) {
          var hBadge = document.createElement('span');
          hBadge.className = 'node-hermes-dot';
          hBadge.title = 'Hermes Gateway Active';
          a.appendChild(hBadge);
        }

        nodesList.appendChild(a);
      }
    }
  });

  /* 当前路由参数解析 */
  function resolveMachine() {
    if (page !== 'machine') return null;
    var segments = window.location.pathname.split('/');
    for (var i = 0; i < segments.length; i += 1) {
      if (segments[i] === 'machine' && segments[i + 1]) {
        try { return decodeURIComponent(segments[i + 1]); } catch (e) { return null; }
      }
    }
    var params = new URLSearchParams(window.location.search);
    return params.get('machine') || null;
  }

  function resolveTask() {
    if (page !== 'task') return null;
    var segments = window.location.pathname.split('/');
    for (var i = 0; i < segments.length; i += 1) {
      if (segments[i] === 'task' && segments[i + 1]) {
        try { return decodeURIComponent(segments[i + 1]); } catch (e) { return null; }
      }
    }
    var params = new URLSearchParams(window.location.search);
    return params.get('task') || null;
  }

  function resolveSession() {
    if (page !== 'session') return null;
    var segments = window.location.pathname.split('/');
    for (var i = 0; i < segments.length; i += 1) {
      if (segments[i] === 'session' && segments[i + 1]) {
        try { return decodeURIComponent(segments[i + 1]); } catch (e) { return null; }
      }
    }
    var params = new URLSearchParams(window.location.search);
    return params.get('session') || null;
  }

  /* 视图挂载 */
  if (page === 'fleet') {
    mountFleet(target, store, client);
  } else if (page === 'machine') {
    var machine = resolveMachine();
    if (machine) {
      if (bcTitle) bcTitle.textContent = 'Node: ' + machine;
      mountMachine(target, machine, store, client);
    } else {
      target.textContent = '未指定机器';
    }
  } else if (page === 'task') {
    var taskId = resolveTask();
    if (taskId) {
      if (bcTitle) bcTitle.textContent = 'Task: ' + taskId;
      mountTask(target, taskId, store, client);
    } else {
      target.textContent = '未指定任务';
    }
  } else if (page === 'session') {
    var sessionId = resolveSession();
    if (sessionId) {
      if (bcTitle) bcTitle.textContent = 'Session: ' + sessionId;
      mountSession(target, sessionId, store, client);
    } else {
      target.textContent = '未指定会话';
    }
  }
</script>
</body>
</html>
