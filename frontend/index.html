<!DOCTYPE html>
<html lang="zh-CN" data-resolved-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<base href="/">
<link rel="icon" type="image/x-icon" href="/assets/brand/mango-cdd3ec60.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/brand/mango-ddf462d0.png">
<title>Agent Fleet · 工作控制台</title>
<link rel="stylesheet" href="./assets/styles/app.css">
<script src="./config.js"></script>
<script src="https://js.hcaptcha.com/1/api.js?render=explicit" async defer></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script type="module" src="./assets/shell/theme.js"></script>
</head>
<body>
<section id="access-state" class="access-state" role="status" hidden><p></p><button type="button" hidden>重新验证</button></section>
<main id="login-view" class="login-page" hidden>
  <section class="login-card" aria-labelledby="login-title">
    <div class="login-brand"><img class="brand-logo" src="/assets/brand/mango-ddf462d0.png" alt=""><span>agent fleet</span></div>
    <h1 id="login-title">登录工作空间</h1>
    <p class="login-description">连接你的助手、工作区与计算节点。</p>
    <form id="login-form">
      <label for="operator-token">操作员令牌</label>
      <input id="operator-token" type="password" required autocomplete="current-password" placeholder="输入操作员令牌">
      <p id="login-status" role="status" aria-live="polite"></p>
      <button type="submit" class="button-primary">登录</button>
    </form>
    <p class="login-footnote"><span data-login-icon="lock"></span>你的工作空间，由你掌控</p>
  </section>
</main>
<div class="console-layout" hidden>
  <a class="skip-link" href="#main-content">跳到主内容</a>
  <aside class="console-sidebar" id="sidebar" aria-label="主导航">
    <a class="console-brand" href="/"><img class="brand-logo" src="/assets/brand/mango-ddf462d0.png" alt=""><span>agent fleet<span class="brand-caption">个人智能工作空间</span></span></a>
    <button type="button" class="icon-button sidebar-collapse" id="sidebar-collapse" aria-label="收起导航" title="收起导航"><span data-icon="chevron-left"></span></button>
    <a class="new-conversation" href="/assistant"><span data-icon="sparkles"></span>开始新对话<span class="nav-shortcut">新建</span></a>
    <p class="nav-group-label">工作空间</p>
    <nav class="console-nav">
      <a href="/account" data-nav="account" hidden><span data-icon="lock"></span>账号设置</a>
      <a href="/" data-nav="fleet"><span data-icon="monitor"></span>总览</a>
      <a href="/assistant" data-nav="assistant"><span data-icon="sparkles"></span>主助手</a>
      <a href="/monitoring" data-nav="monitoring"><span data-icon="globe"></span>服务监控</a>
    </nav>
    <div class="sidebar-adjustable-lists" id="sidebar-adjustable-lists">
      <div class="nav-group-heading conversation-heading"><p class="nav-group-label" id="conversation-heading">最近对话</p><button type="button" class="sidebar-text-button" id="archived-toggle" aria-pressed="false">查看归档</button></div>
      <label class="conversation-search"><span class="sr-only">搜索最近对话</span><input id="conversation-search" type="search" placeholder="搜索最近对话" aria-label="搜索最近对话" autocomplete="off"><kbd>⌘ K</kbd></label>
      <p id="conversation-search-status" class="sidebar-empty" role="status" hidden></p>
      <nav class="console-nodes console-conversations" id="sidebar-conversations" aria-label="最近对话"><p class="sidebar-empty">正在获取对话…</p></nav>
      <div class="nav-group-heading"><p class="nav-group-label">计算节点</p><span id="node-count" class="subtle-count">—</span></div>
      <div class="sidebar-resize-handle" id="sidebar-nodes-resize" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="调整最近对话和计算节点的高度"></div>
      <nav class="console-nodes" id="sidebar-nodes" aria-label="计算节点"><p class="sidebar-empty">正在获取节点…</p></nav>
    </div>
    <div class="sidebar-footer">
      <div class="workspace-identity"><span class="identity-icon" data-icon="lock"></span><div><strong>自托管工作空间</strong><span>你的数据，由你掌控</span></div></div>
      <div class="theme-picker" role="group" aria-label="外观主题">
        <button type="button" data-theme="light" aria-label="浅色主题" title="浅色"><span data-icon="sun"></span></button>
        <button type="button" data-theme="dark" aria-label="深色主题" title="深色"><span data-icon="moon"></span></button>
        <button type="button" data-theme="system" aria-label="跟随系统主题" title="跟随系统"><span data-icon="monitor"></span></button>
      </div>
    </div>
  </aside>
  <dialog class="conversation-dialog" id="conversation-title-dialog" aria-labelledby="conversation-title-heading">
    <form method="dialog">
      <h2 id="conversation-title-heading">重命名对话</h2>
      <label for="conversation-title-input">对话名称</label>
      <input id="conversation-title-input" name="title" type="text" maxlength="120" required autocomplete="off">
      <p id="conversation-title-error" class="conversation-dialog-error" role="alert" hidden></p>
      <div class="conversation-dialog-actions"><button type="button" value="cancel" data-dialog-cancel>取消</button><button type="button" class="button-primary" id="conversation-title-save">保存</button></div>
    </form>
  </dialog>
  <dialog class="conversation-dialog" id="conversation-delete-dialog" aria-labelledby="conversation-delete-heading">
    <form method="dialog">
      <h2 id="conversation-delete-heading">永久删除对话？</h2>
      <p id="conversation-delete-copy">此操作会删除对话消息和运行记录，不能撤销。</p>
      <div class="conversation-dialog-actions"><button type="button" value="cancel" data-dialog-cancel>取消</button><button type="button" class="button-danger" id="conversation-delete-confirm">永久删除</button></div>
    </form>
  </dialog>
  <button class="sidebar-backdrop" id="sidebar-backdrop" aria-label="关闭导航" hidden></button>
  <div class="console-main">
    <header class="console-topbar">
      <div class="topbar-leading"><button type="button" class="icon-button desktop-menu" id="desktop-menu" aria-label="展开导航" title="展开导航" aria-controls="sidebar"><span data-icon="chevron-right"></span></button><button type="button" class="icon-button mobile-menu" id="mobile-menu" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false"><span data-icon="layers"></span></button><span class="topbar-workspace">工作空间</span><span class="breadcrumb-separator">/</span><span id="route-label">总览</span></div>
      <div class="topbar-trailing"><button type="button" id="operator-logout">退出登录</button><span class="connection-indicator" id="connection-status" role="status"><i></i><span>正在连接</span></span><button type="button" class="icon-button" id="refresh-page" aria-label="刷新当前页面" title="刷新当前页面"><span data-icon="refresh"></span></button></div>
    </header>
    <main id="main-content" class="console-content" tabindex="-1">
      <div class="page-heading" id="page-heading"><div><p class="eyebrow" id="page-eyebrow">WORKSPACE OVERVIEW</p><h1 id="page-title">集群总览</h1><p id="page-description">节点、任务与服务状态，一处掌握。</p></div><a class="button-primary" href="/assistant"><span data-icon="sparkles"></span>打开主助手</a></div>
      <section id="route-view" aria-label="页面内容"><p class="loading-state">正在加载工作空间…</p></section>
    </main>
  </div>
</div>
<noscript>请启用 JavaScript 以使用控制台。后端 API 独立提供服务。</noscript>
<script type="module" src="./assets/app.js"></script>
</body>
</html>
