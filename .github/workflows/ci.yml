name: CI

# 打包契约：main 的发布产物一律由此 workflow 产出（2026-09-02 起）。
# 红线：本 workflow 无 secrets、无 SSH、不触宿主/容器；不复制 arch-v2-primary
# 的 deploy.yml（宿主 SSH + 自动部署属历史流程，禁止上 main）。
# 发布 = 下载本 workflow 的 artifact，再走部署与运维 §0 手工 staging SOP。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run test suite
        run: PYTHONPATH=. python -m pytest tests -q

  # 仅 main 上的 push / 手动触发打包。按 ref 判断而非事件类型：
  # PR（refs/pull/*）与从非 main 分支手动 dispatch 都不得产出部署用
  # artifact（按名取件时绝不会拿到未合并代码）。
  package:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build release archive
        run: |
          mkdir -p out
          f="out/agent-fleet-release-${{ github.sha }}.tgz"
          # 溯源戳由打包脚本统一追加（.RELEASE_ORIGIN.tmp 成员；部署解包后
          # mv 为 release 根的 RELEASE_ORIGIN，HK 上可验证来源 commit/run）。
          bash deploy/package-release.sh "$f" \
            "${{ github.sha }}|${{ github.run_id }}|${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          tar -tzf "$f" | tail -3
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-fleet-release
          path: out/agent-fleet-release-*.tgz
          retention-days: 14
          if-no-files-found: error
