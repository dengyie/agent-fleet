name: CI

# 打包契约：main 的发布产物一律由此 workflow 产出（2026-09-02 起）。
# test/package 不接触部署凭据。只有 main 的部署 job 使用 production 环境，
# 经专用受限 SSH 入口提交同一 run 的发布包；宿主保留运行配置和数据库。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never interrupt a production transaction because another main commit arrived.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/fleet-browser" --no-audit --no-fund --package-lock=false playwright@1.63.0
          "$RUNNER_TEMP/fleet-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run test suite
        run: |
          FLEET_PLAYWRIGHT_MODULE="$RUNNER_TEMP/fleet-browser/node_modules/playwright" \
          FLEET_SCREENSHOTS="$RUNNER_TEMP/fleet-test-evidence/browser" \
          FLEET_BROWSER_CHANNEL=chromium PYTHONPATH=. python -m pytest tests -q \
            --junitxml="$RUNNER_TEMP/fleet-test-evidence/results.xml"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-fleet-test-evidence
          path: ${{ runner.temp }}/fleet-test-evidence/
          retention-days: 7
          if-no-files-found: warn

  # 仅 main 上的 push / 手动触发打包。按 ref 判断而非事件类型：
  # PR（refs/pull/*）与从非 main 分支手动 dispatch 都不得产出部署用
  # artifact（按名取件时绝不会拿到未合并代码）。
  package:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build release archive
        run: |
          mkdir -p out
          f="out/agent-fleet-release-${{ github.sha }}.tgz"
          # 溯源戳由打包脚本统一追加（.RELEASE_ORIGIN.tmp 成员；部署解包后
          # mv 为 release 根的 RELEASE_ORIGIN，HK 上可验证来源 commit/run）。
          bash deploy/package-release.sh "$f" \
            "${{ github.sha }}|${{ github.run_id }}|${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          tar -tzf "$f" | tail -3
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-fleet-release
          path: out/agent-fleet-release-*.tgz
          retention-days: 14
          if-no-files-found: error

      - name: Build independent frontend release
        run: bash deploy/package-frontend-release.sh out/frontend "${{ github.sha }}"
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-fleet-frontend
          path: out/frontend/
          retention-days: 14
          if-no-files-found: error
  deploy:
    needs: [test, package]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: agent-fleet-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Reject obsolete main releases
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; this release will not deploy.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.deploy == 'true'
        with:
          name: agent-fleet-release
          path: release/backend
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.deploy == 'true'
        with:
          name: agent-fleet-frontend
          path: release/frontend
      - name: Validate and bundle this run's artifacts
        if: steps.current.outputs.deploy == 'true'
        run: |
          python3 deploy/auto_deploy_ssh.py bundle \
            --backend "release/backend/agent-fleet-release-$GITHUB_SHA.tgz" \
            --frontend release/frontend --output "$RUNNER_TEMP/fleet-deploy.tgz" \
            --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
      - name: Submit restricted deployment
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/fleet-deploy-key"
          known="$RUNNER_TEMP/fleet-deploy-known-hosts"
          trap 'rm -f "$key" "$known"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
          digest=$(sha256sum "$RUNNER_TEMP/fleet-deploy.tgz" | cut -d ' ' -f 1)
          size=$(stat -c %s "$RUNNER_TEMP/fleet-deploy.tgz")
          ssh -T -i "$key" -p "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA $GITHUB_RUN_ID $digest $size" \
            < "$RUNNER_TEMP/fleet-deploy.tgz" | tee "$RUNNER_TEMP/deployment.json"
      - name: Preserve deployment result
        if: always() && steps.current.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-fleet-deployment
          path: ${{ runner.temp }}/deployment.json
          retention-days: 14
          if-no-files-found: warn
