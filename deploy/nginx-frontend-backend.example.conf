# deploy/nginx-frontend-backend.example.conf — 同源前端/后端 Nginx 路由示例
#
# 这是「参考示例」,不是生产配置。用上游占位名 fleet_frontend / fleet_backend,
# 不包含任何真实证书、密钥、token 或凭据;把这些替换成你自己的监听地址/证书。
#
# 目标拓扑(浏览器同源,单域 agent.example.com):
#   - /            -> fleet_frontend  静态前端 release(root / index.html / 页面路由)
#   - /assets/*    -> fleet_frontend  静态资源(带内容哈希,可用 long immutable cache)
#   - /api/*       -> fleet_backend   JSON API / SSE / probe / runner
#
# 认证边界:Cloudflare Access 在边缘(见 deploy/cloudflare-access.md)。
#   Access Bypass 是「边缘策略」,不是 hub 的授权旁路 —— hub 仍按自身凭据
#   (ingest token / runner credential / operator identity)做授权。
#   探针 /api/ingest、/api/scan 与 runner /api/commands/* 的凭据校验都在 hub。
#   本 Nginx 示例本身不做认证,只负责路由。
#
# 同源策略:前端与 API 同域,因此不需要跨域共享(CORS)响应头;同源下浏览器
#   不会发起预检,通配跨域授权既无必要也是安全反模式,路由契约测试会拒绝。

upstream fleet_frontend {
    server 127.0.0.1:8080;   # 示例: 纯静态服务器(python3 -m http.server)或前端 release root
}

upstream fleet_backend {
    server 127.0.0.1:8790;   # 示例: hub/web.py(listen 8790)
}

server {
    listen 443 ssl http2;
    server_name agent.example.com;

    # 示例占位证书 —— 请替换为你自己的路径,不要把真实私钥提交进仓库。
    ssl_certificate     /etc/nginx/ssl/example.pem;
    ssl_certificate_key /etc/nginx/ssl/example.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/agent-fleet.access.log;
    error_log  /var/log/nginx/agent-fleet.error.log;

    # 同源前端 + 后端共享的转发头。
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    # ---- 静态前端 release ----
    location /assets/ {
        proxy_pass http://fleet_frontend;
        # 内容哈希文件名可用长期 immutable 缓存;入口/config.js 不要用。
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://fleet_frontend;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        # index.html / config.js 是运行时入口/配置,不得长期缓存。
        add_header Cache-Control "no-cache";
    }

    # ---- 同名 API 后端 ----
    location /api/tasks {
        proxy_pass http://fleet_backend;
        proxy_read_timeout 60s;
    }

    location /api/machines {
        proxy_pass http://fleet_backend;
        proxy_read_timeout 30s;
    }

    # ---- SSE 流:必须关闭 buffering,否则事件被代理缓存不实时推送 ----
    location /api/stream {
        proxy_pass http://fleet_backend;
        proxy_buffering off;            # SSE 不允许代理缓冲
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;       # 长读超时 > keepalive,避免 SSE 中途断连
        send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ---- probe / runner(机器侧,不带浏览器 cookie;凭据在 hub 校验) ----
    location /api/ingest {
        proxy_pass http://fleet_backend;
        proxy_read_timeout 30s;
    }

    location /api/scan {
        proxy_pass http://fleet_backend;
        proxy_read_timeout 30s;
    }

    location /api/commands/ {
        proxy_pass http://fleet_backend;
        proxy_read_timeout 30s;
    }

    # ---- 其余 /api/* 落到后端 ----
    location /api/ {
        proxy_pass http://fleet_backend;
        proxy_read_timeout 60s;
    }
}