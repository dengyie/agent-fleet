# Independent static release + API backend, same origin. Example only.
# Build frontend with deploy/package-frontend-release.sh; start the Hub with
# --no-serve-frontend. The edge retains the deployment's existing authentication.
upstream fleet_backend {
    server 127.0.0.1:8790;
}
server {
    listen 443 ssl;
    server_name agent.example.com;
    ssl_certificate /etc/nginx/ssl/example.pem;
    ssl_certificate_key /etc/nginx/ssl/example.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/agent-fleet/frontend/current;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    # No CORS wildcard or browser-side machine credential. Keep operator,
    # ingest and runner authorization in their existing backend domains.

    location /assets/ {
        try_files $uri =404;
        # Filenames are not content-hashed: revalidate on each deployment.
        add_header Cache-Control "no-cache";
    }
    location = /config.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location = /api/stream {
        proxy_pass http://fleet_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }
    location /api/ {
        proxy_pass http://fleet_backend;
        proxy_read_timeout 60s;
    }
}
