# hub.example.com — Nginx 站点配置示例（宿主机）
# 部署: 放到 /etc/nginx/sites-available/ + 软链 sites-enabled/，nginx -t && reload
# 把 server_name、证书路径、upstream 换成你自己的值。不要提交真实证书或内网拓扑。
server {
    listen 80;
    listen [::]:80;
    server_name hub.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hub.example.com;

    ssl_certificate     /etc/nginx/ssl/hub.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/hub.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/agent-fleet.access.log;
    error_log  /var/log/nginx/agent-fleet.error.log;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
